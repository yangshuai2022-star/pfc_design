[project]
name = "pfc_design"
version = "0.1.0"
description = "Two-phase interleaved PFC design calculator with optimization"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "fpdf2>=2.7",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "mypy", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["pfc_design*"]
exclude = ["pfc_design.output*", "pfc_design.__pycache__*"]

[tool.setuptools.package-data]
"pfc_design.data" = ["*.json"]
